name: Publish to Maven Central
run-name: Release ${{ inputs.version }} from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer YYYY.M.N, e.g. 2026.9.1 (publishing is irreversible)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: maven-central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release versions in this checkout only
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "Do not rerun a release. Inspect Central and the reserved tag first." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test -s LICENSE
          python3 .github/release-version.py "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Version already reserved. Inspect its previous publication; choose a new version." >&2
            exit 1
          fi
          for artifact in jev4j-parent jev4j-core jev4j-spring-boot-starter; do
            url="https://repo.maven.apache.org/maven2/io/github/maxsumrall/jev4j/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$status" != 404 ]; then
              echo "Central preflight for $artifact returned $status; expected 404. Stopping." >&2
              exit 1
            fi
          done
          echo "Release $RELEASE_VERSION from $RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful CI for the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in ci.yml openrouter-component.yml; do
            if ! runs="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$RELEASE_COMMIT&branch=main&event=push&per_page=1")"; then
              echo "Cannot verify $workflow for $RELEASE_COMMIT; refusing publication." >&2
              exit 1
            fi
            if ! jq -e --arg sha "$RELEASE_COMMIT" '
              .workflow_runs[0] |
              .head_sha == $sha and .head_branch == "main" and .event == "push" and
              .status == "completed" and .conclusion == "success"
            ' <<< "$runs" >/dev/null; then
              echo "Latest main push run of $workflow must succeed for $RELEASE_COMMIT." >&2
              exit 1
            fi
          done
      - name: Set up Java and Central credentials
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Build and test the release artifacts
        run: |
          timestamp="$(git show -s --format=%ct HEAD)"
          ./mvnw --batch-mode --no-transfer-progress -Prelease -Dgpg.skip=true clean install \
            -Dproject.build.outputTimestamp="$timestamp"
          ./mvnw --batch-mode --no-transfer-progress -f consumer-tests/pom.xml verify
          ./mvnw --batch-mode --no-transfer-progress -f examples/plain-java/pom.xml verify exec:java
          ./mvnw --batch-mode --no-transfer-progress -f examples/spring-boot-triage/pom.xml verify
      - name: Reserve annotated source tag before any Central upload
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing RELEASE_TAG_TOKEN environment secret" >&2; exit 1; }
          tag_object="$(jq -n --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_COMMIT" \
            --arg message "Release $RELEASE_VERSION; CI substitutes POM versions. Run $GITHUB_RUN_ID." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, message: $message, object: $sha, type: "commit", tagger: {name: "Max Sumrall", email: "jmsumrall@gmail.com", date: $date}}' |
            gh api --method POST "repos/$GH_REPO/git/tags" --input - --jq .sha)"
          jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" '{ref: $ref, sha: $sha}' |
            gh api --method POST "repos/$GH_REPO/git/refs" --input -
          echo "Reserved $RELEASE_TAG. Never reuse this version, even if publication fails." >> "$GITHUB_STEP_SUMMARY"
      - name: Sign and publish libraries
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "Required environment secret is missing: $name" >&2
              exit 1
            fi
          done
          timestamp="$(git show -s --format=%ct HEAD)"
          ./mvnw --batch-mode --no-transfer-progress -Prelease deploy \
            -Dproject.build.outputTimestamp="$timestamp"
          echo "Published $RELEASE_TAG to Maven Central." >> "$GITHUB_STEP_SUMMARY"
