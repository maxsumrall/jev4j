name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-java-17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            jev4j-core/pom.xml
            jev4j-spring-boot-starter/pom.xml
            consumer-tests/pom.xml
            examples/plain-java/pom.xml
            examples/spring-boot-triage/pom.xml
      - name: Build libraries with static analysis and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean install
      - name: Build standalone examples
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f consumer-tests/pom.xml verify
          ./mvnw --batch-mode --no-transfer-progress -f examples/plain-java/pom.xml verify
          ./mvnw --batch-mode --no-transfer-progress -f examples/spring-boot-triage/pom.xml verify
      - name: Run plain Java example offline
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/plain-java/pom.xml exec:java

  test-java-compatibility:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            jev4j-core/pom.xml
            jev4j-spring-boot-starter/pom.xml
            consumer-tests/pom.xml
      - name: Compile and install with Java 17
        run: ./mvnw --batch-mode --no-transfer-progress clean install -DskipTests
      - name: Compile consumer tests with Java 17
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f consumer-tests/pom.xml test-compile
          ./mvnw --batch-mode --no-transfer-progress -f examples/spring-boot-triage/pom.xml test-compile
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test Java 17 bytecode on Java ${{ matrix.java }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f consumer-tests/pom.xml surefire:test
          ./mvnw --batch-mode --no-transfer-progress -f examples/spring-boot-triage/pom.xml surefire:test
